<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1320" viewBox="0 0 900 1320">
  <rect width="900" height="1320" fill="#f7fafc"/>
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="450" y="62" text-anchor="middle" font-size="36" font-weight="700" fill="#1f2937">Obsidian 图片上传完整流程</text>
    <text x="450" y="104" text-anchor="middle" font-size="21" font-weight="600" fill="#64748b">把本地图片上传到图床，再替换成网络图片链接</text>

    <rect x="180" y="155" width="540" height="120" rx="18" fill="#ffffff" stroke="#0ea5e9" stroke-width="4"/>
    <text x="450" y="202" text-anchor="middle" font-size="30" font-weight="700" fill="#0369a1">1. Obsidian 写笔记</text>
    <text x="450" y="240" text-anchor="middle" font-size="22" fill="#334155">截图、粘贴、拖入图片</text>

    <line x1="450" y1="295" x2="450" y2="350" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <polygon points="424,350 450,402 476,350" fill="#94a3b8"/>

    <rect x="180" y="425" width="540" height="128" rx="18" fill="#ffffff" stroke="#6366f1" stroke-width="4"/>
    <text x="450" y="472" text-anchor="middle" font-size="30" font-weight="700" fill="#4338ca">2. Markdown 先保存本地路径</text>
    <text x="450" y="512" text-anchor="middle" font-size="22" fill="#334155">例如 ![[xxx.png]] 或 assets/xxx.png</text>

    <line x1="450" y1="575" x2="450" y2="630" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <polygon points="424,630 450,682 476,630" fill="#94a3b8"/>

    <rect x="180" y="705" width="540" height="128" rx="18" fill="#ffffff" stroke="#22c55e" stroke-width="4"/>
    <text x="450" y="752" text-anchor="middle" font-size="30" font-weight="700" fill="#15803d">3. 按快捷键手动上传</text>
    <text x="450" y="792" text-anchor="middle" font-size="22" fill="#334155">Image Auto Upload 调用 PicList 接口</text>

    <line x1="450" y1="855" x2="450" y2="910" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <polygon points="424,910 450,962 476,910" fill="#94a3b8"/>

    <rect x="70" y="985" width="340" height="120" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="4"/>
    <text x="240" y="1032" text-anchor="middle" font-size="28" font-weight="700" fill="#b45309">4. 飞牛 PicList</text>
    <text x="240" y="1070" text-anchor="middle" font-size="21" fill="#334155">Docker 服务上传图片</text>

    <line x1="430" y1="1045" x2="490" y2="1045" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <polygon points="490,1019 542,1045 490,1071" fill="#94a3b8"/>

    <rect x="560" y="985" width="270" height="120" rx="18" fill="#ffffff" stroke="#111827" stroke-width="4"/>
    <text x="695" y="1032" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">5. GitHub 图床</text>
    <text x="695" y="1070" text-anchor="middle" font-size="21" fill="#334155">保存图片并返回链接</text>

    <line x1="695" y1="1125" x2="695" y2="1175" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <line x1="695" y1="1175" x2="477" y2="1175" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <polygon points="477,1149 425,1175 477,1201" fill="#94a3b8"/>

    <rect x="145" y="1220" width="610" height="76" rx="16" fill="#eef2ff" stroke="#c7d2fe" stroke-width="3"/>
    <text x="450" y="1252" text-anchor="middle" font-size="24" font-weight="700" fill="#3730a3">6. 插件把本地图片路径替换成网络链接</text>
    <text x="450" y="1283" text-anchor="middle" font-size="20" fill="#334155">复制文章时，不再单独处理图片文件</text>
  </g>
</svg>
